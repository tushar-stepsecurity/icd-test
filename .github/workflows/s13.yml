name: s13 Nested annotated tag chain

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      # v2 -> v2-inner -> commit. A single-hop annotated tag is dereferenced by
      # the runner itself (see s07), so only a nested chain reaches
      # resolveTagChainToCommit.
      - name: Action under test
        uses: tushar-stepsecurity/icd-test-action@v2
