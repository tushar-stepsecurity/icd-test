name: s09 codeql-action v3, the incident

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      # codeql-action's root action.yml is a deliberate stub that exits 1
      # ("This is a stub. Read the documentation instead") - the real entry
      # points are /init, /analyze and so on. That does not matter here: the
      # runner downloads the action repository during "Set up job" and logs the
      # line the analysis parses, before any step executes. continue-on-error
      # keeps the suite green while still feeding the analysis this action@sha.
      - name: Action under test
        continue-on-error: true
        uses: github/codeql-action@6f5948dfacef28e207b48d0905cf90c03365536d
