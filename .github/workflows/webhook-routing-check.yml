# Repeatable routing check: every dispatch produces one insight and one
# detection carrying the same run_id, so the split between the insights webhook
# and the detections webhook can be verified from a single run.
#
# Why this exists alongside multi-webhook-verify: detections are deduplicated on
# (workflow_id, detection), where workflow_id is owner-repo-<workflow path> and
# detection for this type is "Source-Code-Overwritten-<file name>". Neither
# carries a run id, so overwriting the same file from the same workflow produces
# exactly one detection ever, and later runs are correctly silent. Insights are
# per run and keep arriving, which is the asymmetry you see after a second
# dispatch.
#
# This workflow sidesteps that by overwriting a file whose name contains the run
# id, giving every dispatch a detection identity it has never seen. That makes it
# re-runnable indefinitely without editing the workflow or clearing DynamoDB.
name: webhook-routing-check

on:
  workflow_dispatch:
    inputs:
      emit_detection:
        description: Emit a Source-Code-Overwritten detection, unique per run
        type: boolean
        default: true
      emit_insight:
        description: Emit run insights, which fire on every monitored run
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detection:
    name: Emit a detection
    if: ${{ inputs.emit_detection }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      # Checkout first so the agent is watching a real workspace before anything
      # is rewritten.
      - uses: actions/checkout@v6

      - name: Overwrite a file unique to this run
        run: |
          set -uo pipefail
          fixture="src/fixture-${{ github.run_id }}.py"
          mkdir -p src

          printf 'print("original")\n' > "$fixture"
          sleep 10

          # Truncating rewrite by a different process than the one that created
          # it, so the agent records an overwrite rather than a create.
          python3 -c "open('$fixture','w').write('print(\"overwritten\")\n')"

          echo "--- rewritten ---"
          ls -l "$fixture"
          echo "expect detection: Source-Code-Overwritten-fixture-${{ github.run_id }}.py"

      - name: Settle
        run: sleep 25

  insight:
    name: Emit run insights
    if: ${{ inputs.emit_insight }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      - name: Make a few outbound calls
        run: |
          set -uo pipefail
          for host in api.github.com github.com objects.githubusercontent.com; do
            echo "calling $host"
            curl -sS --max-time 15 -o /dev/null "https://$host" || true
          done
