# AI triage verification on int (package-security-agent imposter-commit-agent +
# agent-api callback). Every icd-test-action SHA below is fresh and on no branch, so
# each is a first sighting that triggers one triage. int runs in enforce mode: a
# confirmed or re-proven false_positive verdict is written; needs_review never is.
name: triage-int

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Expect: merged PR head (squash-merged, branch deleted): expect false_positive written
  s1_merged_pr_head:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@508a72ebbbc66fa618dac9bd02b48cbce936bb8f

  # Expect: tag with a published release, parent on main: expect false_positive written
  s2_release_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@3ab9f5d0b10d598b906cb52213943d76b2744c94

  # Expect: tip of a deleted branch: expect false_positive written if activity shows the deletion, else needs_review
  s3_deleted_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@fbdfc80e7c86136678471672107afaececf666fc

  # Expect: replaced by a force push: expect false_positive written if activity shows it, else needs_review
  s4_force_pushed:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@bb24158e300fcc818d41fda1a93af2845d44127f

  # Expect: tag without a release: expect needs_review
  s5_tag_no_release:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@19d42ac1a0e36dba122cdd96bdfcf27ae9033d14

  # Expect: action posts the runner environment to an external host (.invalid, never resolves): expect confirmed, written
  s6_malicious:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@a41c30b6dbe3331587c6c24b742988f0862669cc

  # Expect: commit message tells reviewers to mark it safe: expect needs_review with the steering flag
  s7_steering:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@6bff575bbf41319c75222e9e4211fdd4b3923e15
