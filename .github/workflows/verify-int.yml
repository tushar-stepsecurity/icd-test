# One verification pass against int. Every icd-test-action SHA below was created
# fresh, so no ImposterCommits row can exist for it and each job forces a real
# analysis instead of a cache hit.
#
# harden-runner@int is itself analysed and int is not its default branch, so every
# job also reports non-default-branch for step-security/harden-runner. That is the
# harness, not a result.
name: verify-int

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Expect: no detection - on the default branch
  valid_main_tip:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@5f82f245d087705e48f779474427f6768f19a2d7

  # Expect: non-default-branch - contained in releases/v5, found by the walk
  valid_release_mid:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@bccb5bf35c233356a23371805c88e334b91f6854

  # Expect: non-default-branch - head of releases/v5, found by the fast path
  valid_release_tip:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@842ee72e2d6b8a73b10b17ac3f95b0525c6083c2

  # Expect: non-default-branch - the 26 Aug incident SHA
  valid_codeql_action:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      # Root action.yml is a stub that exits 1; the Set up job download line is
      # what the analysis consumes.
      - uses: github/codeql-action@6f5948dfacef28e207b48d0905cf90c03365536d
        continue-on-error: true

  # Expect: IMPOSTER - orphaned, shares history
  imposter_shared:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@fdd6cfaab462ed6d751ddd61abbf0956ed52ad28

  # Expect: IMPOSTER - orphaned, compare returns 404 No common ancestor
  imposter_unrelated:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@int
        with:
          egress-policy: audit
      - uses: tushar-stepsecurity/icd-test-action@099c6b75d2b0fac2b2d225fa770f8498940f735a
