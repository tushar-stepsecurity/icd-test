# Proves that the multiple-webhook integration routes each event category to its
# own destination: detections to one webhook, StepSecurity API audit logs to
# another. Targets int (harden-runner@int, int.api.stepsecurity.io), because
# multi-webhook support only exists there.
#
# Prerequisites in the int admin console, Integrations -> Webhook:
#   1. "Use multiple webhooks" is on.
#   2. The detections webhook subscribes to Detections AND has this repo picked in
#      its Repository Selection. Detections are org/repo filtered per destination,
#      and a destination added with "Add Webhook" starts with nothing selected, so
#      an empty Repository Selection silently delivers nothing.
#   3. The audit logs webhook subscribes to API Audit Logs. Those are tenant
#      level, so Repository Selection does not apply to them. Turn Insights off
#      there unless you want run insights mixed in.
#   4. Audit logging is enabled for the tenant, otherwise there are no audit log
#      records to export in the first place.
#
# Repo secret for the audit-log job: STEPSECURITY_INT_API_KEY, a tenant key for int.
#
# The pass condition is isolation, not just delivery: the detection must not
# appear on the audit logs webhook, and the audit log must not appear on the
# detections webhook.
name: multi-webhook-verify

on:
  workflow_dispatch:
    inputs:
      emit_detection:
        description: Emit an Agent-Tampered detection for the detections webhook
        type: boolean
        default: true
      emit_audit_log:
        description: Call an audited StepSecurity API for the audit logs webhook
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detection:
    name: Emit a detection
    if: ${{ inputs.emit_detection }}
    runs-on: ubuntu-latest
    steps:
      # Audit mode on purpose. Two other detection routes were ruled out first:
      # a blocked egress call needs block mode, which currently degrades to audit
      # on GitHub-hosted runners because harden-runner cannot fetch the Actions
      # cache URL; and an anomalous outbound call only fires once a baseline
      # exists, which defaults to 100 runs of this job.
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      # Killing the monitoring agent makes harden-runner report the AgentTampered
      # scenario, which CorrelateRun turns into an Agent-Tampered detection. That
      # needs no baseline and works in audit mode, so it fires on the first run.
      #
      # Fails loudly if the agent is still alive afterwards: a silent no-op here
      # would look identical to "the webhook routing is broken".
      - name: Tamper with the monitoring agent
        run: |
          set -uo pipefail
          echo "--- agent processes before ---"
          ps -eo pid,comm,args | grep '[a]gent' || echo "(none matched)"

          sudo killall -9 agent 2>/dev/null || true
          sudo pkill -9 -x agent 2>/dev/null || true
          sleep 3

          echo "--- agent processes after ---"
          ps -eo pid,comm,args | grep '[a]gent' || echo "(none matched)"

          if pgrep -x agent >/dev/null 2>&1; then
            echo "::error::agent is still running, the tamper did not take effect and no detection will be generated"
            exit 1
          fi
          echo "agent stopped, expect an Agent-Tampered detection for this run"

      # Give the run a little length so the post step reports the scenario.
      - name: Settle
        run: sleep 20

  audit-log:
    name: Emit an API audit log
    if: ${{ inputs.emit_audit_log }}
    runs-on: ubuntu-latest
    steps:
      # Deliberately no harden-runner here. Audit logs come from StepSecurity API
      # calls, not runner telemetry, and leaving this job unmonitored keeps it
      # from contributing detections that would muddy the isolation check.
      #
      # repo.controls.refresh is an audited write that only recomputes posture, so
      # it is safe to call repeatedly and leaves no other state behind.
      - name: Trigger an audited StepSecurity API write
        env:
          API_KEY: ${{ secrets.STEPSECURITY_INT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::STEPSECURITY_INT_API_KEY is not set, cannot emit an audit log"
            exit 1
          fi
          code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${API_KEY}" \
            "https://int.api.stepsecurity.io/v1/github/${{ github.repository }}/refresh/controls")
          echo "repo.controls.refresh -> HTTP ${code}"
          cat /tmp/refresh.json || true
          echo
          [ "${code}" -lt 400 ]
