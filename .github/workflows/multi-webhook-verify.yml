# Proves that the multiple-webhook integration routes each event category to its
# own destination: detections to one webhook, StepSecurity API audit logs to
# another. Targets int (harden-runner@int, int.api.stepsecurity.io), because
# multi-webhook support only exists there.
#
# Prerequisites in the int admin console, Integrations -> Webhook:
#   1. "Use multiple webhooks" is on.
#   2. The detections webhook subscribes to Detections AND has this repo picked in
#      its Repository Selection. Detections are org/repo filtered per destination,
#      and a destination added with "Add Webhook" starts with nothing selected, so
#      an empty Repository Selection silently delivers nothing.
#   3. The audit logs webhook subscribes to API Audit Logs. Those are tenant
#      level, so Repository Selection does not apply to them. Turn Insights off
#      there unless you want run insights mixed in.
#   4. Audit logging is enabled for the tenant, otherwise there are no audit log
#      records to export in the first place.
#
# Repo secret for the audit-log job: STEPSECURITY_INT_API_KEY, a tenant key for int.
#
# The pass condition is isolation, not just delivery: the detection must not
# appear on the audit logs webhook, and the audit log must not appear on the
# detections webhook.
name: multi-webhook-verify

on:
  workflow_dispatch:
    inputs:
      emit_detection:
        description: Emit a Source-Code-Overwritten detection for the detections webhook
        type: boolean
        default: true
      emit_tamper:
        description: Also kill the agent for an Agent-Tampered detection, hangs the job
        type: boolean
        default: false
      emit_insight:
        description: Emit run insights, which fire on every monitored run
        type: boolean
        default: true
      emit_audit_log:
        description: Call an audited StepSecurity API for the audit logs webhook
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detection:
    name: Emit a detection
    if: ${{ inputs.emit_detection }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      # Checkout first so the agent observes the repository's real files before
      # any of them are rewritten.
      - uses: actions/checkout@v6

      # Source-Code-Overwritten comes from a file event the agent records when an
      # existing file is rewritten in place. Preferred over killing the agent
      # (Agent-Tampered): that does report the scenario, but it leaves the runner
      # unable to shut down, so the job hangs for around 17 minutes and ends
      # cancelled. Set emit_tamper to use that path instead.
      #
      # Paths under .git, temp and _temp are excluded from file insights, so the
      # rewrites target tracked files and a src directory.
      - name: Overwrite tracked files
        run: |
          set -uo pipefail
          mkdir -p src
          printf 'print("original")\n' > src/app.py
          printf 'console.log("original");\n' > src/app.js
          sleep 10

          # Truncating rewrites, by a different process than the one that created
          # them, so they register as overwrites rather than creates.
          python3 -c "open('README.md','w').write('overwritten by run ${{ github.run_id }}\n')"
          python3 -c "open('src/app.py','w').write('print(\"overwritten\")\n')"
          python3 -c "open('src/app.js','w').write('console.log(\"overwritten\");\n')"

          echo "--- rewritten ---"
          ls -l README.md src

      - name: Settle
        run: sleep 25

  tamper:
    name: Emit a detection by tampering
    if: ${{ inputs.emit_tamper }}
    runs-on: ubuntu-latest
    # Killing the agent leaves the runner unable to shut down cleanly, so this
    # job sits idle after its work is done. Bounded so it cannot occupy a runner
    # for the default 6 hours.
    timeout-minutes: 6
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      - name: Tamper with the monitoring agent
        run: |
          set -uo pipefail
          echo "--- agent processes before ---"
          ps -eo pid,comm,args | grep '[a]gent' || echo "(none matched)"

          sudo killall -9 agent 2>/dev/null || true
          sudo pkill -9 -x agent 2>/dev/null || true
          sleep 3

          echo "--- agent processes after ---"
          ps -eo pid,comm,args | grep '[a]gent' || echo "(none matched)"

          if pgrep -x agent >/dev/null 2>&1; then
            echo "::error::agent is still running, the tamper did not take effect and no detection will be generated"
            exit 1
          fi
          echo "agent stopped, expect an Agent-Tampered detection for this run"

      - name: Settle
        run: sleep 20

  insight:
    name: Emit run insights
    if: ${{ inputs.emit_insight }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@int
        with:
          egress-policy: audit

      # Insights are emitted for every monitored run: no baseline, no block mode,
      # nothing to trigger. That makes them the most reliable probe of whether a
      # destination can receive anything at all, which is why this job exists
      # separately from the detection one. The calls below only serve to give the
      # insight payload a recognizable endpoint list.
      - name: Make a few outbound calls
        run: |
          set -uo pipefail
          for host in api.github.com github.com objects.githubusercontent.com; do
            echo "calling $host"
            curl -sS --max-time 15 -o /dev/null "https://$host" || true
          done

  audit-log:
    name: Emit an API audit log
    if: ${{ inputs.emit_audit_log }}
    runs-on: ubuntu-latest
    steps:
      # Deliberately no harden-runner here. Audit logs come from StepSecurity API
      # calls, not runner telemetry, and leaving this job unmonitored keeps it
      # from contributing detections that would muddy the isolation check.
      #
      # repo.controls.refresh is an audited write that only recomputes posture, so
      # it is safe to call repeatedly and leaves no other state behind.
      - name: Trigger an audited StepSecurity API write
        env:
          API_KEY: ${{ secrets.STEPSECURITY_INT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::STEPSECURITY_INT_API_KEY is not set, cannot emit an audit log"
            exit 1
          fi
          code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${API_KEY}" \
            "https://int.api.stepsecurity.io/v1/github/${{ github.repository }}/refresh/controls")
          echo "repo.controls.refresh -> HTTP ${code}"
          cat /tmp/refresh.json || true
          echo
          [ "${code}" -lt 400 ]
